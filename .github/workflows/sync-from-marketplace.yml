name: Sync from mcp-marketplace

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout amplitude-copilot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Checkout mcp-marketplace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: amplitude/mcp-marketplace
          path: _upstream
          ref: main

      - name: Capture upstream SHA
        id: upstream
        run: |
          set -eo pipefail
          cd _upstream
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mirror skills/
        run: |
          set -eo pipefail
          rsync -a --delete \
            _upstream/plugins/amplitude/skills/ \
            skills/

      - name: Sync description and version into plugin.json
        run: |
          set -eo pipefail
          description=$(jq -r '.plugins[] | select(.name == "amplitude") | .description' _upstream/.claude-plugin/marketplace.json)
          version=$(jq -r '.plugins[] | select(.name == "amplitude") | .version' _upstream/.claude-plugin/marketplace.json)

          if [ -z "$description" ] || [ "$description" = "null" ]; then
            echo "::error::Could not extract description from upstream marketplace.json"
            exit 1
          fi
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not extract version from upstream marketplace.json"
            exit 1
          fi

          jq --arg d "$description" --arg v "$version" \
            '.description = $d | .version = $v' \
            plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugin.json

      - name: Cleanup upstream checkout
        run: rm -rf _upstream

      - name: Create or update sync PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: sync/marketplace
          delete-branch: true
          title: 'chore: sync skills from mcp-marketplace@${{ steps.upstream.outputs.short }}'
          commit-message: 'chore: sync skills from mcp-marketplace@${{ steps.upstream.outputs.short }}'
          body: |
            Automated sync of `skills/` and `plugin.json` (description, version) from
            [`amplitude/mcp-marketplace@${{ steps.upstream.outputs.short }}`](https://github.com/amplitude/mcp-marketplace/commit/${{ steps.upstream.outputs.sha }}).

            See [SYNC.md](../blob/main/SYNC.md) for details on what does and does not sync.
